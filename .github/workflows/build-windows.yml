name: Build Windows Desktop
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore engine.jsx and apply desktop patches
        shell: bash
        run: |
          git show 680ae3e01a7458d2141026bd92d4e58d258b52dd:src/darkhorse/engine.jsx > src/darkhorse/engine.jsx
          python scripts/patch-engine-desktop.py
          # CSS polish for keys / selection / tile-x / seg
          cat >> src/darkhorse/extras.css <<'CSS'

          /* Compact key cards */
          .key-card {
            padding: 8px 10px !important;
            gap: 6px !important;
            min-height: 0 !important;
            height: auto !important;
          }
          .key-card .input,
          .key-card input.input {
            height: 32px !important;
            min-height: 32px !important;
            padding: 4px 10px !important;
          }
          .key-card .key-balance { font-size: 12px !important; line-height: 1.2 !important; }
          .keys-list { display: flex !important; flex-direction: column !important; gap: 8px !important; }

          /* Dimmer thinner selection */
          .key-card.on,
          .prompt-slot.on {
            border-width: 1px !important;
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line)) !important;
            box-shadow: none !important;
          }

          /* Fix tile X button alignment */
          .tile-x {
            position: absolute !important;
            top: 6px !important;
            right: 6px !important;
            width: 22px !important;
            height: 22px !important;
            display: grid !important;
            place-items: center !important;
            padding: 0 !important;
            line-height: 1 !important;
            border-radius: 6px !important;
          }

          /* Aspect / resolution like top hotbar */
          .seg button {
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            position: relative !important;
          }
          .seg button.active {
            color: var(--text) !important;
            background: transparent !important;
            box-shadow: none !important;
          }
          .seg button.active::after {
            content: "" !important;
            position: absolute !important;
            left: 12% !important;
            right: 12% !important;
            bottom: 0 !important;
            height: 2px !important;
            background: linear-gradient(90deg, transparent, var(--accent), transparent) !important;
            box-shadow: 0 0 10px var(--glow) !important;
          }
          CSS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install electron packager and srvx
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          npm install electron@33.2.1 @electron/packager@18.3.5 srvx --no-save --no-audit --no-fund || npm install electron@33.2.1 @electron/packager@18.3.5 srvx --no-save --no-audit --no-fund
      - name: Build app
        shell: bash
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js build
          node scripts/migrate.mjs || true
          test -f .vercel/output/functions/__server.func/index.mjs && echo "SERVER OK" || echo "SERVER MISSING"
      - name: Stage lean desktop package
        shell: bash
        run: |
          rm -rf stage
          mkdir -p stage/desktop stage/.vercel/output stage/node_modules
          cp desktop/main.cjs desktop/preload.cjs stage/desktop/
          cp -r .vercel/output/static stage/.vercel/output/
          cp -r .vercel/output/functions stage/.vercel/output/
          cp .vercel/output/nitro.json stage/.vercel/output/ 2>/dev/null || true
          cp .vercel/output/config.json stage/.vercel/output/ 2>/dev/null || true
          if [ -d node_modules/srvx ]; then cp -r node_modules/srvx stage/node_modules/; fi
          for d in ufo destr cookie-es defu radix3 h3; do
            if [ -d "node_modules/$d" ]; then cp -r "node_modules/$d" stage/node_modules/; fi
          done
          cat > stage/package.json <<'EOF'
          {
            "name": "dark-horse",
            "productName": "Dark Horse",
            "version": "1.0.0",
            "author": "Dark Horse",
            "main": "desktop/main.cjs",
            "private": true
          }
          EOF
          du -sh stage
          ls stage/.vercel/output/functions/__server.func/index.mjs
      - name: Package Electron Windows
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: bash
        run: |
          npx @electron/packager ./stage DarkHorse \
            --platform=win32 \
            --arch=x64 \
            --out=release \
            --overwrite \
            --electron-version=33.2.1
          du -sh release/DarkHorse-win32-x64
      - name: Zip with 7z
        shell: bash
        run: |
          cd release
          7z a -tzip -mx=5 ../DarkHorse-Windows.zip DarkHorse-win32-x64
          ls -lh ../DarkHorse-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DarkHorse-Windows
          path: DarkHorse-Windows.zip
          if-no-files-found: error
